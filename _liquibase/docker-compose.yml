services:
  liquibase:
    image: liquibase/liquibase:5.0.3
    container_name: liquibase
    env_file:
      - .env
    network_mode: host
    working_dir: /liquibase/changelog
    volumes:
      - ./liquibase:/liquibase/changelog
      - ./drivers:/liquibase/lib
    entrypoint:
      - liquibase
      - --defaults-file=/liquibase/changelog/liquibase.properties